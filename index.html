<!-- Mensagem de Sucesso Automática -->
<div id="mensagem-sucesso" style="display: none; background: rgba(0, 200, 83, 0.15); border: 1px solid #00c853; padding: 20px; border-radius: 12px; margin: 20px auto; max-width: 600px; text-align: center; color: #fff;">
    <h3 style="color: #00c853; margin-bottom: 8px;">Doação Confirmada! 🙏</h3>
    <p style="margin: 0; font-size: 1.05rem;">Obrigado por apoiar essa causa e Deus te abençoe por isso!</p>
</div>

<script>
  // Verifica se a URL contém "?status=sucesso"
  window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('status') === 'sucesso') {
      const msgBox = document.getElementById('mensagem-sucesso');
      if (msgBox) {
        msgBox.style.display = 'block';
        // Joga a tela suavemente para a mensagem aparecer em destaque
        msgBox.scrollIntoView({ behavior: 'smooth' });
      }
    }
  });
</script>
